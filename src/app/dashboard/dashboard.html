<main>
  <h2>Create a new post</h2>

  <div>
    <input type="text" [(ngModel)]="postTitle" placeholder="Post Title..." />
    <textarea
      type="text"
      [(ngModel)]="postSummary"
      placeholder="Post Summary..."
      rows="4"
    ></textarea>
    <button (click)="submitPosts()">Submit Post</button>
  </div>

  <div>
    <hr />

    <h2>Manage Post</h2>
    <div>
      @for (post of blogPosts; track post.title; let i = $index) {
        <p>{{ post.title }}</p>
        <button (click)="removePost(i)">Delete</button>
      } @empty {
        <p>No Post to Manage</p>
      }
    </div>
  </div>
</main>
